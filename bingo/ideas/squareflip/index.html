<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="description" content="Some flippy bingo stuff :3">
	
	<title>Square Flip Bingo (custom) - Nkitten's space</title>
	
	<!-- https://github.com/davidbau/seedrandom -->
	<script src="../../res/script/davidbau-seedrandom-min.js" type="text/javascript"></script>
	<script src="squareflipbingo-custom.js"></script>
	
	<link rel="stylesheet" type="text/css" href="../../../includes/nkittennet.css"/>
	<link rel="stylesheet" type="text/css" href="squareflipbingo-custom.css"/>
</head>
<body>
	<div id="bingoWrapper">
		<div id="bingoBoard"></div>
	</div>
	<div id="settings">
		<div>
			<label for="nr-board-cols">Cols </label><input type="number" id="nr-board-cols" value="5" min="1" max="20"> &times;
			<input type="number" id="nr-board-rows" value="5" min="1" max="20"><label for="nr-board-rows"> Rows</label><br />
			<label for="txt-seed">Seed: </label><input type="text" id="txt-seed" value="" placeholder="Seed (empty for random)"><br />
			<input type="checkbox" id="chk-saveboardstate" checked="checked" /><label for="chk-saveboardstate">Save board state and restore it when loading page</label><br />
			<button id="btn-generateboard">Generate Board</button>
		</div>
		<fieldset data-listid="1">
			<legend>Front side</legend>
			<input type="radio" name="radio-1" value="inorder" id="radio-1-inorder" checked="checked" /><label for="radio-1-inorder">In order</label>
			<input type="radio" name="radio-1" value="random" id="radio-1-random" /><label for="radio-1-random">Random</label><br />
			<label for="txt-default-1">Default: </label><input type="text" id="txt-default-1" class="txt-default-value" value="Slot {#}" placeholder="Front side default value"><br />
			<input type="checkbox" id="chk-repeat-1" /><label for="chk-repeat-1">Repeat if fewer values than slots</label><br />
			<br />
			<label for="textarea-list-1">Front side value list:</label><br />
			<textarea id="textarea-list-1" cols="30" rows="10" class="textarea-list" placeholder="Front side values (one per line)"></textarea>
		</fieldset>
		<fieldset data-listid="2">
			<legend>Flip side</legend>
			<input type="radio" name="radio-2" value="inorder" id="radio-2-inorder" /><label for="radio-2-inorder">In order</label>
			<input type="radio" name="radio-2" value="random" id="radio-2-random" checked="checked" /><label for="radio-2-random">Random</label><br />
			<label for="txt-default-2">Default: </label><input type="text" id="txt-default-2" class="txt-default-value" value="Back {#}" placeholder="Flip side default value"><br />
			<input type="checkbox" id="chk-repeat-2" /><label for="chk-repeat-2">Repeat if fewer values than slots</label><br />
			<br />
			<label for="textarea-list-2">Flip side value list:</label><br />
			<textarea id="textarea-list-2" cols="30" rows="10" class="textarea-list" placeholder="Flip side values (one per line)"></textarea>
		</fieldset>
	</div>
</body>
</html>
