<!DOCTYPE html>
<html>
<head>
<title>Shattered Relics League - Nkitten's space</title>
<script src="shatteredrelics.js"></script>

<link rel="stylesheet" type="text/css" href="../../includes/nkittennet.css"/>
<link rel="stylesheet" type="text/css" href="shatteredrelics.css"/>
</head>
<body>
	<div id="pageContainer">
		<div id="filtersDiv">
			<div id="filtersLevel">
				<span class="levelfilter selected" data-level="0">Locked</span><br />
				<span class="levelfilter selected" data-level="1">Level 1</span><br />
				<span class="levelfilter selected" data-level="2">Level 2</span><br />
				<span class="levelfilter selected" data-level="3">Level 3</span>
			</div>
			<div id="filtersSet">
				<select id='ms-seteffects' size='9' multiple="multiple">
					<option value="absoluteunit">Absolute Unit</option>
					<option value="thealchemist">The Alchemist</option>
					<option value="chainmagic">Chain Magic</option>
					<option value="thecraftsman">The Craftsman</option>
					<option value="doubletap">Double Tap</option>
					<option value="drakanstouch">Drakan's Touch</option>
					<option value="endlessknowledge">Endless Knowledge</option>
					<option value="fastmetabolism">Fast Metabolism</option>
					<option value="greedygatherer">Greedy Gatherer</option>
					<option value="knifesedge">Knife's Edge</option>
					<option value="lastrecall">Last Recall</option>
					<option value="personalbanker">Personal Banker</option>
					<option value="trailblazer">Trailblazer</option>
					<option value="twinstrikes">Twin Strikes</option>
					<option value="unchainedtalent">Unchained Talent</option>
				</select>
			</div>
		</div>
		<div id="fragmentTableDiv"></div>
	</div>
</body>
</html>
