		function makeBoard() {
			let txt = "";
			let taskNr = 0;
			for (let r = 1; r <= boardInfo.rowCount; r++) {
				txt += `<tr data-row="${r}"><td class="line-reward" data-line="row${r}"><img class="front-image" src="../img/tasks/${(lineRewards[`row${r}`]?.pics?.[0] ? lineRewards[`row${r}`].pics[0] : (lineRewards[`row${r}`].front === "?" ? "GM-Line-Reward.png" : `GM-Line-row${r}.png`))}">${(lineRewards[`row${r}`].back ? `<img class="back-image" src="../img/rewards/${(lineRewards[`row${r}`]?.pics?.[1] ? lineRewards[`row${r}`].pics[1] : (lineRewards[`row${r}`].back === "?" ? "GM-Line-Reward.png" : `GM-Line-row${r}.png`))}">` : "")}<span class="textover"><span class="task-count-current">0</span> / <span class="task-count-total">${boardInfo.colCount}</span></span></td>`;
				for (let c = 1; c <= boardInfo.colCount; c++) {
					txt += `<td class="grid-tile" data-tier="${tasks[taskNr].tier}" data-taskNr="${taskNr}" data-row="${r}" data-col="${c}"><img class="front-image" src="../img/tasks/${(tasks[taskNr]?.pics?.[0] ? tasks[taskNr].pics[0] : (tasks[taskNr].task === "?" ? `GM-Tile-${tasks[taskNr].tier}.png` : `R${r}T${c}-T.png`))}"><img class="back-image" src="../img/rewards/${(tasks[taskNr]?.pics?.[1] ? tasks[taskNr].pics[1] : (tasks[taskNr].task === "?" ? `GM-Tile-${tasks[taskNr].tier}.png` : `R${r}T${c}-R.png`))}"><span class="textover"></span></td>`;
					taskNr++;
				}
				txt += "</tr>";
			}
			txt += `<tr data-row="${boardInfo.colCount + 1}"><td id="board-totals"><span class="textover"><span class="task-count"><span class="task-count-current">0</span> / <span class="task-count-total">${boardInfo.rowCount * boardInfo.colCount}</span></span><span class="grid-points">0 points</span></span></td>`;
			for (let c = 1; c <= boardInfo.colCount; c++) {
				txt += `<td class="line-reward" data-line="col${c}"><img class="front-image" src="../img/tasks/${(lineRewards[`col${c}`]?.pics?.[0] ? lineRewards[`col${c}`].pics[0] : (lineRewards[`col${c}`].front === "?" ? "GM-Line-Reward.png" : `GM-Line-col${c}.png`))}">${(lineRewards[`col${c}`].back ? `<img class="back-image" src="../img/rewards/${(lineRewards[`col${c}`]?.pics?.[1] ? lineRewards[`col${c}`].pics[1] : (lineRewards[`col${c}`].back === "?" ? "GM-Line-Reward.png" : `GM-Line-col${c}.png`))}">` : "")}<span class="textover"><span class="task-count-current">0</span> / <span class="task-count-total">${boardInfo.rowCount}</span></span></td>`;
			}
			txt += "</tr>";
			return txt;
		}
		
		function getTime() {
			return new Date().getTime();
		}
		function displayDate(t) {
			const d = new Date(t);
			const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
			return months[d.getMonth()] + " " + d.getDate() + "<br>" + d.getHours() + ":" + ((d.getMinutes() < 10) ? "0" + d.getMinutes() : d.getMinutes()) + ":" + ((d.getSeconds() < 10) ? "0" + d.getSeconds() : d.getSeconds());
		}
		function displayTimeToComplete(t) {
			const seconds = Math.floor(t / 1000);
			let days = Math.floor(seconds / 86400);
			let hours = Math.floor(seconds / 3600) % 24;
			let minutes = Math.floor(seconds / 60) % 60;
			return `${(days > 0 ? days + ` day${days === 1 ? "" : "s"}<br>` : "")}${(hours > 0 ? hours + "h " : "")}${minutes + "m"}`;
		}
		
		function setTaskState(nr, completion, loadedData, allowPush = true) {
			const time = getTime();
			const tile = document.querySelector(`#grid-table .grid-tile[data-tasknr='${nr}']`);
			
			taskInfo.tasksCompleted += (completion ? 1 : -1);
			taskInfo.pointsEarned += pointsPerTier[tasks[nr].tier] * (completion ? 1 : -1);
			
			const taskData = loadedData ?? {completedOrder: taskInfo.tasksCompleted, completedAt: time, timeToComplete: (time - taskInfo.startTime)};
			if (allowPush === true) task_history.push([nr, taskData]);
			
			tile.classList.toggle("completed", completion);
			tile.querySelector(".textover").innerHTML = (completion ? `<span class="order">${taskData.completedOrder}</span><span class="date">${displayDate(taskData.completedAt)}</span><span class="timetocomplete">${displayTimeToComplete(taskData.timeToComplete)}</span><span class="points">${pointsPerTier[tasks[nr].tier]} points</span>` : "");
			
			const row = "row" + tile.getAttribute("data-row");
			const col = "col" + tile.getAttribute("data-col");
			lineRewards[row].tasksCompleted += (completion ? 1 : -1);
			lineRewards[col].tasksCompleted += (completion ? 1 : -1);
			document.querySelector(`#grid-table .line-reward[data-line='${row}'] .task-count-current`).innerHTML = lineRewards[row].tasksCompleted;
			document.querySelector(`#grid-table .line-reward[data-line='${col}'] .task-count-current`).innerHTML = lineRewards[col].tasksCompleted;
			document.querySelector("#grid-table #board-totals .task-count-current").innerHTML = taskInfo.tasksCompleted;
			document.querySelector("#grid-table #board-totals .grid-points").innerHTML = taskInfo.pointsEarned + " points";
			document.querySelector(`#grid-table .line-reward[data-line='${row}']`).classList.toggle("completed", lineRewards[row].tasksCompleted === boardInfo.rowCount);
			document.querySelector(`#grid-table .line-reward[data-line='${col}']`).classList.toggle("completed", lineRewards[col].tasksCompleted === boardInfo.rowCount);
		}
		function recalculateFromHistory() {
			taskInfo.tasksCompleted = 0;
			taskInfo.pointsEarned = 0;
			document.querySelector("#grid-table #board-totals .task-count-current").innerHTML = "0";
			document.querySelector("#grid-table #board-totals .grid-points").innerHTML = "0 points";
			for (let line in lineRewards) {
				lineRewards[line].tasksCompleted = 0;
				const cellOver = document.querySelector(`#grid-table .line-reward[data-line='${line}'] .task-count-current`);
				if (cellOver) cellOver.innerHTML = "0";
			}
			document.querySelectorAll("#grid-table .grid-tile").forEach(ele => {
				ele.classList.remove("completed");
				ele.querySelector(".textover").innerHTML = "";
			});
			
			for (let t in task_history) {
				const task = task_history[t];
				task[1].completedOrder = Number(t)+1;
				task[1].timeToComplete = task[1].completedAt - taskInfo.startTime;
				setTaskState(task[0], true, task[1], false);
			}
		}
		
		function displayTaskInfo(tile) {
			const front = tile.querySelector(".front-image").getAttribute("src");
			const back = tile.querySelector(".back-image")?.getAttribute("src") ?? front;
			if (tile.classList.contains("grid-tile")) {
				const nr = tile.getAttribute("data-tasknr");
				return `<span class="board-position" data-tier="${tile.getAttribute("data-tier")}">Row ${tile.getAttribute("data-row")}, Column ${tile.getAttribute("data-col")}</span><img class="front-image" src="${front}"><span class="mid-text">${tasks[nr].task}<br>&darr;<br>${tasks[nr].reward}</span><img class="back-image" src="${back}">`;
			}
			if (tile.classList.contains("line-reward")) {
				const line = tile.getAttribute("data-line");
				const lineName = (line.slice(0,3) === "row" ? "Row " + line.slice(3) : "Column " + line.slice(3));
				return `<span class="board-position" data-tier="line">Complete ${lineName}</span><img class="front-image" src="${front}"><span class="mid-text">${lineRewards[line].front}${(lineRewards[line].back ? "<br>+<br>" + lineRewards[line].back : "")}</span><img class="back-image" src="${back}">`;
			}
		}
		
		document.addEventListener("DOMContentLoaded", function() {
			document.querySelector("#grid-table tbody").innerHTML = makeBoard();
			recalculateFromHistory();
			
			const gridTable = document.getElementById("grid-table");
			document.getElementById("toggle-btn").addEventListener("click", function(evt) {
				gridTable.setAttribute("data-showside", (gridTable.getAttribute("data-showside") === "front" ? "back" : "front"));
			});
			
			gridTable.addEventListener("mouseenter", function(evt) {
				if (["grid-tile", "line-reward"].some(className => evt.target.classList.contains(className))) {
					const taskInfoHTML = displayTaskInfo(evt.target);
					document.getElementById("hover-task-info").innerHTML = taskInfoHTML;
					document.getElementById("float-task-info").innerHTML = taskInfoHTML;
				}
			}, {capture: true});
			
			document.getElementById("dd-textover").addEventListener("change", function() {
				gridTable.setAttribute("data-textover", this.value);
			});
			document.getElementById("chk-floattaskinfo").addEventListener("change", function() {
				if (this.checked) document.body.setAttribute("data-floattaskinfo", "true");
				else document.body.removeAttribute("data-floattaskinfo");
			});
		});
	</script>

		} */
		 
		#settings {
			margin-block: 1em;
			text-align: center;
		}
		.task-info:has([data-tier='line']) { --border: hsl(from var(--cyan) h 50% 50%); }
		.task-info:has([data-tier='auto']) { --border: hsl(from var(--cyan) h s l); }
		.task-info:has([data-tier='easy']) { --border: hsl(from var(--green) h 50% 40%); }
		.task-info:has([data-tier='medium']) { --border: hsl(from var(--orange) h 60% 50%); }
		.task-info:has([data-tier='hard']) { --border: hsl(from var(--red) h 70% 55%); }
		
		.task-info {
			max-width: fit-content;
			margin: 5px auto;
			padding: 8px;
			border: 1px solid var(--border, transparent);
			
			display: grid;
			grid-template-areas: "pos pos pos" "front mid back";
			justify-content: center;
			align-items: center;
			justify-items: center;
			gap: 6px;
			text-align: center;
			
			.board-position {
				grid-area: pos;
				font-size: 1.5em;
				font-weight: bold;
			}
			
			img { width: 75px; }
			.front-image { grid-area: front; }
			.back-image { grid-area: back; }
			
			.mid-text {
				grid-area: mid;
				min-width: 100px;
			}
		}
		.task-info:empty {
			display: none;
		}
		#float-task-info {
			display: none;
		}
		
		@media (max-width: 1236px) {
			#pageContainer {
				width: min-content;
				grid-template-columns: min-content;
				grid-template-areas: "grid" "side";
			}
			
			@supports(position-try-fallbacks: top) {
				/* @position-try --custom-top {
					position-area: top;
					margin-bottom: 10px;
				} */
				@position-try --custom-right-bottom {
					left: calc(anchor(right) + 10px);
					bottom: anchor(bottom);
					margin: 0;
				}
				@position-try --custom-right-top {
					left: calc(anchor(right) + 10px);
					top: anchor(top);
					margin: 0;
				}
				@position-try --custom-left-bottom {
					right: calc(anchor(left) + 10px);
					bottom: anchor(bottom);
					margin: 0;
				}
				@position-try --custom-left-top {
					right: calc(anchor(left) + 10px);
					top: anchor(top);
					margin: 0;
				}
				
				.grid-tile:hover,
				.line-reward:hover {
					anchor-name: --my-anchor;
				}
				body[data-floattaskinfo='true'] :has(.grid-tile:hover, .line-reward:hover) #float-task-info {
					display: grid;
					position: fixed;
					z-index: 9;
					margin: 10px;
					background-color: var(--page-bg, #555);
					
					position-anchor: --my-anchor;
					position-try-fallbacks: top, bottom, --custom-right-top, --custom-right-bottom, --custom-left-top, --custom-left-bottom;
					/* position-visibility: no-overflow; */
				}
			}
		}
	</style>
</head>
<body data-floattaskinfo="true">
	<div id="pageContainer">
		<main id="grid-container">
			<table id="grid-table" class="rs-box" data-showside="front" data-textover="timetocomplete">
				<tbody></tbody>
			</table>
			<div id="float-task-info" class="task-info"></div>
		</main>
		<aside id="side-content">
			<div class="sticky-wrapper">
				<button id="toggle-btn" class="rs-box">Flip Tiles</button>
				<div id="settings">
					<label for="dd-textover">Label completed tasks: </label><select id="dd-textover">
						<option value="none">No label</option>
						<option value="order">Order completed</option>
						<option value="date">Date completed</option>
						<option value="timetocomplete" selected>Time to complete</option>
						<option value="points">Points earned</option>
					</select><br>
					<input type="checkbox" id="chk-floattaskinfo" checked><label for="chk-floattaskinfo">Try floating task details near hovered tile on small screens</label>
				</div>
				<div id="hover-task-info" class="task-info"><span class="board-position" data-tier="line">(hover task for info)</span><img class="front-image" src="../img/tasks/GM-Line-Reward.png"><span class="mid-text">?</span><img class="back-image" src="../img/tasks/GM-Line-Reward.png"></div>
			</div>
		</aside>
	</div>
</body>
</html>
